name: Android APK

# Builds the Android app in mobile/ (a Capacitor wrapper around the live site), signs it with the
# key held in repository secrets, and publishes the APK as the "android-latest" release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor and sync the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Sign and verify
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias canteen \
            --ks-pass env:KS_PASS --out quickcanteen.apk aligned.apk
          "$BT/apksigner" verify --print-certs quickcanteen.apk | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/release.p12"
          ls -la quickcanteen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quickcanteen-apk
          path: quickcanteen.apk

      - name: Publish release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest quickcanteen.apk \
            --title "QuickCanteen for Android (build ${{ github.run_number }})" \
            --notes "Download quickcanteen.apk on your Android phone and open it to install. Android will ask you to allow installing apps from your browser the first time."
